name: CI

# When should this workflow run?
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # GitHub provides a fresh Linux VM for each run
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repo's code onto the VM
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install the .NET SDK (match your TargetFramework)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Download NuGet packages
      - name: Restore
        run: dotnet restore

      # 4. Compile the solution
      - name: Build
        run: dotnet build --no-restore -c Release

      # 5. Run your xUnit tests
      - name: Test
        run: dotnet test --no-build -c Release

      # 6. Make sure the Dockerfile still builds
      - name: Build Docker image
        run: docker build -t myapi:${{ github.sha }} .
  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/myapi:latest
            ghcr.io/${{ github.repository_owner }}/myapi:${{ github.sha }}
  deploy:
    # Runs only after publish succeeds
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMG="ghcr.io%2F${OWNER}%2Fmyapi%3A${GITHUB_SHA}" 
          curl --fail --silent --show-error "$DEPLOY_URL"

      - name: Verify the new version is live
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 30); do
            LIVE=$(curl --silent --max-time 30 "$APP_URL/version" || true)
            echo "Attempt $i: live version = '$LIVE'"
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "New version is live."
              curl --fail --silent --show-error --max-time 30 "$APP_URL/health"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for $GITHUB_SHA to go live."
          exit 1